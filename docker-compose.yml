# Pendências da Fábrica — Caddy (proxy/TLS) + PHP-FPM (aplicação)
#
# Primeiro uso:
#   docker compose up -d --build
#   docker compose exec php php cli/migrar.php
#   docker compose exec php php cli/criar-usuario.php --login admin --senha '...' --papel ADMIN
#
# O banco SQLite vive no volume "dados" — sobrevive a rebuilds.
# Para domínio/TLS em produção, troque ":80" no Caddyfile pelo seu domínio
# (o Caddy emite certificado automaticamente).

services:
  php:
    build: .
    restart: unless-stopped
    volumes:
      - dados:/var/www/html/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dados:
  caddy_data:
  caddy_config:
